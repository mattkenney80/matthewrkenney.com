<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320">
  <defs>
    <style>
      .cartoon-text { font-family: Georgia, serif; font-size: 12px; fill: #1a1a1a; }
      .cartoon-quote { font-family: Georgia, serif; font-size: 13px; fill: #333; font-style: italic; }
    </style>
  </defs>

  <rect width="560" height="320" fill="#fafaf8"/>
  <rect x="8" y="8" width="544" height="304" fill="none" stroke="#333" stroke-width="1.5"/>

  <!-- Desk -->
  <line x1="70" y1="225" x2="490" y2="225" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="70" y1="225" x2="70" y2="270" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="490" y1="225" x2="490" y2="270" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Stool -->
  <line x1="145" y1="245" x2="185" y2="245" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="150" y1="245" x2="145" y2="285" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="180" y1="245" x2="185" y2="285" stroke="#1a1a1a" stroke-width="1.2"/>

  <!-- Figure hunched over desk (back curve, head, arm down) -->
  <path d="M 150 250 Q 145 190 175 175 Q 200 165 215 178" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <circle cx="230" cy="165" r="24" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 210 190 Q 200 210 218 225" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <path d="M 150 250 Q 155 265 175 270 Q 190 273 195 260" fill="none" stroke="#1a1a1a" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Drink glass on desk -->
  <path d="M 258 200 L 262 225 L 280 225 L 284 200 Z" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>

  <!-- Laptop / device with two dots (a face) -->
  <rect x="320" y="195" width="130" height="60" rx="3" fill="#1a1a1a"/>
  <circle cx="345" cy="220" r="4" fill="#fafaf8"/>
  <circle cx="368" cy="220" r="4" fill="#fafaf8"/>

  <!-- Antenna + wifi signal above device -->
  <line x1="352" y1="195" x2="352" y2="160" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="352" cy="155" r="3.5" fill="#1a1a1a"/>
  <path d="M 372 175 Q 385 160 400 150" fill="none" stroke="#1a1a1a" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 382 190 Q 400 172 420 160" fill="none" stroke="#1a1a1a" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Small dashes suggesting other furniture -->
  <line x1="115" y1="270" x2="145" y2="270" stroke="#999" stroke-width="1.4"/>
  <line x1="405" y1="245" x2="435" y2="245" stroke="#999" stroke-width="1.4"/>
  <line x1="405" y1="258" x2="435" y2="258" stroke="#999" stroke-width="1.4"/>

  <!-- Quote -->
  <text x="30" y="280" class="cartoon-quote" text-anchor="start">
    "Breaks any code on earth. Still won't tell me why she left."
  </text>

  <text x="30" y="300" class="cartoon-text" font-size="10" text-anchor="start" fill="#999">
    — Sneakers
  </text>
</svg>
