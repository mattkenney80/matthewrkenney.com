<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320">
  <defs>
    <style>
      .cartoon-text { font-family: Georgia, serif; font-size: 12px; fill: #1a1a1a; }
      .cartoon-quote { font-family: Georgia, serif; font-size: 11px; fill: #555; font-style: italic; }
      .ink { fill: none; stroke: #1a1a1a; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: #1a1a1a; stroke-width: 1; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="560" height="320" fill="#fafaf8"/>
  <rect x="8" y="8" width="544" height="304" fill="none" stroke="#333" stroke-width="1.5"/>

  <!-- ground -->
  <line x1="20" y1="228" x2="540" y2="228" class="ink"/>

  <!-- hanging sausages, upper left -->
  <line x1="42" y1="30" x2="42" y2="55" class="thin"/>
  <ellipse cx="42" cy="70" rx="10" ry="18" class="thin"/>
  <line x1="65" y1="30" x2="65" y2="52" class="thin"/>
  <ellipse cx="65" cy="68" rx="9" ry="17" class="thin"/>
  <line x1="88" y1="30" x2="88" y2="58" class="thin"/>
  <ellipse cx="88" cy="75" rx="10" ry="19" class="thin"/>

  <!-- deli counter, left -->
  <line x1="35" y1="90" x2="35" y2="188" class="ink"/>
  <line x1="35" y1="90" x2="90" y2="90" class="ink"/>
  <line x1="55" y1="90" x2="55" y2="188" class="thin"/>
  <line x1="35" y1="188" x2="90" y2="188" class="ink"/>
  <line x1="35" y1="200" x2="90" y2="200" class="ink"/>
  <line x1="90" y1="188" x2="90" y2="228" class="ink"/>

  <!-- two men in coats and hats -->
  <g>
    <ellipse cx="130" cy="88" rx="30" ry="14" class="ink"/>
    <path d="M104 92 Q104 108 130 108 Q156 108 156 92" class="ink"/>
    <circle cx="130" cy="118" r="18" class="ink"/>
    <circle cx="123" cy="116" r="1.4" fill="#1a1a1a"/>
    <circle cx="137" cy="116" r="1.4" fill="#1a1a1a"/>
    <line x1="122" y1="127" x2="138" y2="127" class="thin"/>
    <path d="M108 136 L98 226 L114 226 L114 178 L130 178 L130 226 L146 226 L162 226 L146 178 L162 178 L162 226" class="ink"/>
    <path d="M108 136 Q130 148 152 136" class="thin"/>
    <path d="M113 175 Q108 190 113 202" class="thin"/>
    <path d="M147 175 Q152 190 147 202" class="thin"/>
  </g>

  <g transform="translate(90,10)">
    <ellipse cx="130" cy="88" rx="28" ry="13" class="ink"/>
    <path d="M105 92 Q105 106 130 106 Q155 106 155 92" class="ink"/>
    <circle cx="130" cy="116" r="17" class="ink"/>
    <circle cx="123" cy="114" r="1.3" fill="#1a1a1a"/>
    <circle cx="137" cy="114" r="1.3" fill="#1a1a1a"/>
    <path d="M122 124 Q130 129 138 124" class="thin"/>
    <path d="M110 134 L101 216 L116 216 L116 172 L130 172 L130 216 L144 216 L159 216 L144 172 L159 172 L159 216" class="ink"/>
    <path d="M110 134 Q130 145 150 134" class="thin"/>
    <path d="M114 170 Q109 183 114 194" class="thin"/>
    <path d="M146 170 Q151 183 146 194" class="thin"/>
  </g>

  <!-- hanging pendant lamp, upper right -->
  <line x1="440" y1="30" x2="440" y2="90" class="thin"/>
  <path d="M415 90 Q440 70 465 90 Z" fill="#e6e4de" stroke="#1a1a1a" stroke-width="1.2"/>

  <!-- barred booth on the right -->
  <rect x="360" y="120" width="150" height="72" class="thin"/>
  <line x1="385" y1="120" x2="385" y2="192" class="thin"/>
  <line x1="410" y1="120" x2="410" y2="192" class="thin"/>
  <line x1="435" y1="120" x2="435" y2="192" class="thin"/>
  <line x1="460" y1="120" x2="460" y2="192" class="thin"/>
  <line x1="485" y1="120" x2="485" y2="192" class="thin"/>

  <!-- counter shelf under the booth -->
  <line x1="345" y1="196" x2="525" y2="196" class="ink"/>
  <line x1="355" y1="196" x2="355" y2="228" class="thin"/>
  <line x1="515" y1="196" x2="515" y2="228" class="thin"/>

  <!-- Nokes: scared face behind the bars, holding a wrapped sandwich -->
  <path d="M405 130 Q420 118 435 130 L438 178 L402 178 Z" class="ink"/>
  <circle cx="417" cy="150" r="4" fill="#1a1a1a"/>
  <circle cx="433" cy="150" r="4" fill="#1a1a1a"/>
  <path d="M415 162 Q425 168 435 162" class="thin"/>
  <path d="M438 165 L455 158 L462 168 L448 176 Z" fill="#e6e4de" stroke="#1a1a1a" stroke-width="1"/>

  <!-- quote -->
  <text x="30" y="255" class="cartoon-quote" text-anchor="start">
    "We'll take those brisket sandwiches to go."
  </text>

  <text x="30" y="276" class="cartoon-text" font-size="10" text-anchor="start" fill="#999">
    — Sleepers
  </text>
</svg>
