<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320">
  <defs>
    <style>
      .cartoon-text { font-family: Georgia, serif; font-size: 12px; fill: #1a1a1a; }
      .cartoon-quote { font-family: Georgia, serif; font-size: 11px; fill: #555; font-style: italic; }
      .ink { fill: none; stroke: #1a1a1a; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: #1a1a1a; stroke-width: 1.1; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="560" height="320" fill="#fafaf8"/>
  <rect x="8" y="8" width="544" height="304" fill="none" stroke="#333" stroke-width="1.5"/>

  <!-- window, upper left -->
  <rect x="35" y="25" width="55" height="55" class="thin"/>
  <line x1="62.5" y1="25" x2="62.5" y2="80" class="thin"/>
  <line x1="35" y1="52.5" x2="90" y2="52.5" class="thin"/>

  <!-- ground line -->
  <line x1="20" y1="200" x2="540" y2="200" class="ink"/>

  <!-- figure: lab coat, head, one arm reaching to a flask -->
  <circle cx="185" cy="72" r="20" class="ink"/>
  <path d="M177 68 Q185 72 193 68" class="thin"/>
  <circle cx="178" cy="68" r="1.2" fill="#1a1a1a"/>
  <circle cx="192" cy="68" r="1.2" fill="#1a1a1a"/>
  <path d="M172 60 Q185 50 198 60" class="thin"/>

  <!-- lab coat body -->
  <path d="M158 190 L166 100 Q172 90 185 90 Q198 90 204 100 L212 190 Z" class="ink"/>
  <line x1="185" y1="95" x2="182" y2="185" class="thin"/>
  <line x1="170" y1="120" x2="168" y2="150" class="thin"/>
  <line x1="200" y1="120" x2="202" y2="150" class="thin"/>

  <!-- far arm hanging -->
  <path d="M166 105 Q135 120 128 165" class="ink"/>
  <path d="M128 165 L118 178" class="thin"/>

  <!-- near arm reaching toward flask, holding a small vial -->
  <path d="M204 105 Q235 118 248 148" class="ink"/>
  <ellipse cx="258" cy="158" rx="12" ry="8" class="ink" transform="rotate(20 258 158)"/>
  <rect x="245" y="132" width="8" height="16" class="thin" transform="rotate(20 249 140)"/>
  <line x1="257" y1="154" x2="264" y2="150" class="thin"/>

  <!-- lab bench on the right -->
  <rect x="330" y="192" width="200" height="10" class="ink"/>

  <!-- beaker -->
  <path d="M347 148 L347 175 Q347 182 355 182 L363 182 Q371 182 371 175 L371 148 Z" class="thin"/>

  <!-- tall glass -->
  <rect x="390" y="150" width="20" height="32" class="thin"/>
  <line x1="390" y1="164" x2="410" y2="164" class="thin"/>

  <!-- erlenmeyer flask with dots (bubbling) -->
  <path d="M432 148 L432 160 L420 182 L448 182 L436 160 L436 148 Z" class="thin"/>
  <line x1="428" y1="145" x2="440" y2="145" class="thin"/>
  <circle cx="429" cy="172" r="1.4" fill="#1a1a1a"/>
  <circle cx="437" cy="178" r="1.4" fill="#1a1a1a"/>

  <!-- squared jar, divided (like a cigarette pack) -->
  <rect x="465" y="152" width="30" height="30" class="thin"/>
  <line x1="480" y1="152" x2="480" y2="182" class="thin"/>

  <!-- quote -->
  <text x="30" y="235" class="cartoon-quote" text-anchor="start">
    "Find what you love and let it kill you."
  </text>

  <text x="30" y="258" class="cartoon-text" font-size="10" text-anchor="start" fill="#999">
    — The Insider
  </text>
</svg>
